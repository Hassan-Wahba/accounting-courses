<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>بوابة المقررات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --pine:#103F39;
  --pine-deep:#0B2C28;
  --pine-soft:#1B554C;
  --gold:#C8A24B;
  --gold-dim:#A8823A;
  --paper:#F5F3ED;
  --card:#FFFFFF;
  --ink:#16302B;
  --muted:#6E827C;
  --line:#E5E1D6;
  --soft:#F0EEE6;
  --danger:#B4472F;
  --ok:#2E7D5B;
  --fh:'Tajawal',system-ui,-apple-system,sans-serif;
  --fb:'IBM Plex Sans Arabic',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--fb);
  background:var(--paper);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  line-height:1.7;
}
button{font-family:inherit;cursor:pointer}
a{color:inherit}

/* ====== بوابة الدخول ====== */
#gate{
  min-height:100vh;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:24px 16px;
  background:
    radial-gradient(1100px 520px at 50% -12%, #16514A 0%, rgba(22,81,74,0) 62%),
    linear-gradient(180deg,#0E3A34 0%, #0B2C28 100%);
}
.gate-card{
  width:100%;max-width:420px;
  background:var(--card);
  border-radius:18px;
  padding:38px 30px 30px;
  text-align:center;
  box-shadow:0 26px 60px rgba(4,26,23,.38);
  border-top:3px solid var(--gold);
}
.seal{
  width:54px;height:54px;margin:0 auto 18px;
  border-radius:50%;
  background:var(--pine);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 0 4px #fff,0 0 0 5px var(--gold);
}
.seal svg{width:22px;height:22px;fill:none;stroke:var(--gold);stroke-width:1.9}
.gate-card h1{font-family:var(--fh);font-size:23px;font-weight:800;color:var(--pine);letter-spacing:-.2px}
.gate-card p{font-size:13.5px;color:var(--muted);margin-top:7px}
.pw-wrap{margin-top:24px;position:relative}
#pw{
  width:100%;padding:14px 16px;
  border:1.5px solid var(--line);border-radius:11px;
  background:var(--paper);
  font-family:var(--fb);font-size:15px;letter-spacing:.5px;
  direction:ltr;text-align:center;
  color:var(--ink);
  transition:border-color .18s,box-shadow .18s;
}
#pw:focus{outline:none;border-color:var(--pine);box-shadow:0 0 0 3px rgba(16,63,57,.09);background:#fff}
#enter{
  width:100%;margin-top:12px;padding:13px;
  border:0;border-radius:11px;
  background:var(--pine);color:#fff;
  font-family:var(--fh);font-size:15.5px;font-weight:700;
  transition:background .18s,transform .12s;
}
#enter:hover{background:var(--pine-soft)}
#enter:active{transform:translateY(1px)}
#enter:disabled{opacity:.6;cursor:wait}
#err{
  min-height:20px;margin-top:12px;
  font-size:13px;color:var(--danger);font-weight:500;
  opacity:0;transition:opacity .2s;
}
#err.on{opacity:1}
.gate-foot{margin-top:26px;font-size:11.5px;color:rgba(255,255,255,.4);letter-spacing:.4px;direction:ltr}

/* ====== الترويسة ====== */
#app{min-height:100vh;display:flex;flex-direction:column}
#app[hidden]{display:none}
header{
  background:linear-gradient(180deg,#134A43 0%,#0E3630 100%);
  padding:26px 0 24px;
}
.wrap{max-width:900px;margin:0 auto;padding:0 20px}
.brand{display:flex;align-items:center;gap:14px}
.brand h1{font-family:var(--fh);font-size:27px;font-weight:800;color:#fff;letter-spacing:-.3px;white-space:nowrap}
.brand .rule{flex:0 0 46px;height:3px;background:var(--gold);border-radius:2px}
header .sub{margin-top:6px;font-size:13px;color:#A9C2BC;letter-spacing:.2px}

/* ====== شريط الأسابيع ====== */
.weeks-band{background:#fff;border-bottom:1px solid var(--line);padding:16px 0 18px}
.weeks-label{font-size:11.5px;color:var(--gold-dim);font-weight:600;letter-spacing:.6px;margin-bottom:10px}
.weeks{display:flex;gap:9px;overflow-x:auto;padding:3px 2px 6px;scrollbar-width:thin}
.weeks::-webkit-scrollbar{height:5px}
.weeks::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
.wk{
  flex:0 0 auto;width:38px;height:38px;border-radius:50%;
  border:1.5px solid var(--line);background:#fff;
  color:var(--pine);font-family:var(--fh);font-size:14.5px;font-weight:700;
  display:flex;align-items:center;justify-content:center;
  transition:all .16s;
}
.wk:hover:not(.locked){border-color:var(--pine);background:var(--soft)}
.wk.active{background:var(--pine);color:#fff;border-color:#fff;box-shadow:0 0 0 2px var(--gold)}
.wk.locked{opacity:.38;cursor:not-allowed;background:var(--soft)}

/* ====== محتوى الأسبوع ====== */
main{flex:1;padding:26px 0 46px}
.wk-head{margin-bottom:20px}
.wk-tag{
  display:inline-flex;align-items:center;gap:9px;
  font-size:12px;color:var(--gold-dim);font-weight:600;letter-spacing:.4px;
}
.wk-tag .dot{width:3px;height:3px;border-radius:50%;background:var(--line)}
.wk-tag .date{color:var(--muted);font-weight:500}
.wk-head h2{font-family:var(--fh);font-size:25px;font-weight:800;color:var(--pine);margin-top:4px;letter-spacing:-.2px}
.wk-head .desc{font-size:14px;color:var(--muted);margin-top:6px;max-width:660px}

.sec{
  background:var(--card);border:1px solid var(--line);border-radius:13px;
  margin-bottom:11px;overflow:hidden;
  transition:box-shadow .18s;
}
.sec:hover{box-shadow:0 2px 14px rgba(16,63,57,.05)}
.sec-head{
  width:100%;display:flex;align-items:center;gap:12px;
  padding:15px 17px;background:none;border:0;text-align:right;
}
.badge{
  flex:0 0 auto;width:29px;height:29px;border-radius:50%;
  background:var(--pine);color:#fff;
  font-family:var(--fh);font-size:13px;font-weight:700;
  display:flex;align-items:center;justify-content:center;
}
.sec-title{font-family:var(--fh);font-size:16.5px;font-weight:700;color:var(--pine);flex:0 0 auto}
.chip{
  font-size:11.5px;color:var(--muted);background:var(--soft);
  padding:3px 10px;border-radius:999px;font-weight:500;
  flex:0 0 auto;
}
.spacer{flex:1}
.caret{
  flex:0 0 auto;color:var(--muted);font-size:10px;
  transition:transform .2s;
}
.sec.open .caret{transform:rotate(180deg)}
.sec-body{display:none;padding:0 17px 15px;border-top:1px solid var(--line);margin-top:0}
.sec.open .sec-body{display:block;padding-top:13px}

.row{
  display:flex;align-items:center;gap:10px;
  background:var(--paper);border:1px solid transparent;
  border-radius:9px;padding:12px 14px;margin-bottom:8px;
  text-decoration:none;transition:all .16s;
}
a.row:hover{background:#fff;border-color:var(--pine);transform:translateX(-2px)}
.row:last-child{margin-bottom:0}
.row .label{font-size:14.5px;font-weight:500;color:var(--ink)}
.row .tag{font-size:10.5px;color:var(--muted);letter-spacing:.5px;font-weight:600;direction:ltr}
.row .arrow{color:var(--pine);font-size:15px}
.row.off{opacity:.55}
.row.off .tag{color:var(--muted)}

/* الاختبار */
.q{background:var(--paper);border-radius:10px;padding:14px 15px;margin-bottom:10px}
.q:last-child{margin-bottom:0}
.q .qt{font-size:14.5px;font-weight:600;color:var(--ink);margin-bottom:11px;display:flex;gap:8px}
.q .qn{color:var(--gold-dim);font-family:var(--fh);font-weight:700;flex:0 0 auto}
.opt{
  display:block;width:100%;text-align:right;
  background:#fff;border:1.5px solid var(--line);border-radius:8px;
  padding:9px 13px;margin-bottom:7px;
  font-family:var(--fb);font-size:13.5px;color:var(--ink);
  transition:all .15s;
}
.opt:hover:not(:disabled){border-color:var(--pine)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:#EFF7F2;color:var(--ok);font-weight:600}
.opt.wrong{border-color:var(--danger);background:#FBF0ED;color:var(--danger)}
.why{
  display:none;font-size:12.5px;color:var(--muted);
  background:#fff;border-right:2.5px solid var(--gold);
  padding:9px 12px;border-radius:0 7px 7px 0;margin-top:8px;
}
.why.on{display:block}

/* المصطلحات */
.term{background:var(--paper);border-radius:10px;padding:12px 14px;margin-bottom:8px}
.term:last-child{margin-bottom:0}
.term .t{font-family:var(--fh);font-size:15px;font-weight:700;color:var(--pine)}
.term .en{font-size:12px;color:var(--gold-dim);font-weight:500;direction:ltr;display:inline-block;margin-right:8px}
.term .d{font-size:13.5px;color:var(--muted);margin-top:4px}

/* التكليف */
.due{
  display:flex;align-items:center;gap:9px;flex-wrap:wrap;
  background:#FFFDF6;border:1px solid #EADFC2;border-right:3px solid var(--gold);
  border-radius:0 9px 9px 0;padding:11px 14px;margin-bottom:9px;
}
.due .lb{font-size:12px;color:var(--gold-dim);font-weight:600;letter-spacing:.3px}
.due .dt{font-family:var(--fh);font-size:15px;font-weight:700;color:var(--pine)}
.task{
  font-size:14px;color:var(--ink);line-height:1.8;white-space:pre-wrap;
  background:var(--paper);border-radius:10px;padding:12px 14px;margin-bottom:9px;
}

.empty{font-size:13px;color:var(--muted);padding:10px 2px;text-align:center}

/* حالة القفل */
.locked-box{
  background:var(--card);border:1px dashed var(--line);border-radius:13px;
  padding:46px 24px;text-align:center;
}
.locked-box .ic{font-size:26px;margin-bottom:10px;opacity:.35}
.locked-box h3{font-family:var(--fh);font-size:18px;color:var(--pine);font-weight:700}
.locked-box p{font-size:13.5px;color:var(--muted);margin-top:6px}

footer{
  border-top:1px solid var(--line);padding:18px 0;
  text-align:center;font-size:11.5px;color:var(--muted);
  letter-spacing:.5px;direction:ltr;
}

/* ====== بند ملفه محمي ====== */
button.row{width:100%;border:1px solid transparent;font:inherit;color:inherit;text-align:right;cursor:pointer}
button.row:hover{background:#fff;border-color:var(--pine);transform:translateX(-2px)}
button.row:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.row .tag svg{width:11px;height:11px;fill:none;stroke:var(--gold-dim);stroke-width:2.3;vertical-align:-1px;margin-right:5px}

/* ====== العارض المحمي ====== */
body.vw-open{overflow:hidden}
#pv{
  position:fixed;inset:0;z-index:60;
  display:flex;flex-direction:column;background:#1B2724;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  opacity:0;transition:opacity .18s ease;
}
#pv[hidden]{display:none}
#pv.on{opacity:1}
.pv-bar{
  flex:0 0 auto;display:flex;align-items:center;gap:10px;
  padding:9px 14px;color:#fff;
  background:linear-gradient(180deg,#134A43 0%,#0E3630 100%);
  border-bottom:2px solid var(--gold);
}
.pv-bar button{
  display:flex;align-items:center;justify-content:center;
  color:#fff;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);
  font-family:var(--fh);transition:background .15s;
}
.pv-bar button:hover:not(:disabled){background:rgba(255,255,255,.16)}
.pv-bar button:disabled{opacity:.35;cursor:default}
.pv-x{flex:0 0 auto;width:36px;height:36px;border-radius:50%;font-size:15px}
.pv-t{flex:1;min-width:0;line-height:1.35}
.pv-t b{display:block;font-family:var(--fh);font-size:15.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pv-t span{display:block;font-size:11.5px;color:#A9C2BC;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pv-ctl{flex:0 0 auto;display:flex;align-items:center;gap:5px}
.pv-ctl button{width:32px;height:32px;border-radius:8px;font-size:18px;font-weight:700;line-height:1}
.pv-ctl .pv-z{width:auto;min-width:54px;padding:0 8px;font-size:12.5px;font-weight:600}
.pv-pg{
  flex:0 0 auto;font-size:12px;font-weight:600;color:var(--gold);white-space:nowrap;
  background:rgba(200,162,75,.12);border:1px solid rgba(200,162,75,.3);
  padding:3px 11px;border-radius:999px;
}
.pv-pg:empty{display:none}
.pv-main{flex:1;position:relative;min-height:0}
.pv-body{position:absolute;inset:0;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:16px 0 40px}
.pv-pages{width:max-content;min-width:100%;padding:0 12px}
.pv-page{position:relative;margin:0 auto 14px;background:#fff;box-shadow:0 6px 24px rgba(0,0,0,.35);overflow:hidden}
.pv-page canvas{position:absolute;top:0;left:0;width:100%;height:100%;display:block}
.pv-page .sh{position:absolute;inset:0;z-index:2}
.pv-page.ld:after{
  content:'';position:absolute;top:50%;left:50%;width:26px;height:26px;margin:-13px 0 0 -13px;
  border-radius:50%;border:3px solid var(--line);border-top-color:var(--gold);animation:pvs .8s linear infinite;
}
.pv-page.bad:after{
  content:'الصفحة دي ما اتعرضتش';position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--muted);
}
.pv-st{
  position:absolute;inset:0;z-index:3;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  padding:24px;text-align:center;color:#DCE7E4;background:#1B2724;
}
.pv-st[hidden]{display:none}
.pv-st .msg{font-size:14.5px;max-width:340px}
.pv-spin{width:30px;height:30px;border-radius:50%;border:3px solid rgba(255,255,255,.14);border-top-color:var(--gold);animation:pvs .8s linear infinite}
.pv-prog{width:220px;max-width:70vw;height:4px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden}
.pv-prog i{display:block;height:100%;width:0;background:var(--gold);transition:width .15s}
.pv-ic{
  width:44px;height:44px;border-radius:50%;border:2px solid rgba(200,162,75,.6);color:var(--gold);
  font-family:var(--fh);font-size:22px;font-weight:800;display:flex;align-items:center;justify-content:center;
}
.pv-retry{border:0;border-radius:10px;padding:10px 24px;background:var(--gold);color:#3A2C0C;font-family:var(--fh);font-size:14.5px;font-weight:700}
.pv-note{
  position:absolute;left:50%;bottom:18px;z-index:4;
  transform:translate(-50%,12px);opacity:0;pointer-events:none;
  background:rgba(11,44,40,.95);color:#fff;border:1px solid rgba(200,162,75,.45);
  padding:9px 16px;border-radius:10px;font-size:13px;white-space:nowrap;transition:all .2s;
}
.pv-note.on{opacity:1;transform:translate(-50%,0)}
@keyframes pvs{to{transform:rotate(360deg)}}

@media(max-width:600px){
  .brand h1{font-size:22px}
  .brand .rule{flex-basis:30px}
  .wk-head h2{font-size:21px}
  .sec-head{padding:13px 14px;gap:9px}
  .sec-title{font-size:15px}
  .wrap{padding:0 15px}
  .pv-bar{padding:8px 10px;gap:8px}
  .pv-t b{font-size:14px}
  .pv-ctl .pv-z,.pv-pg .pw{display:none}
  .pv-ctl button{width:30px;height:30px}
  .pv-note{white-space:normal;width:86%;text-align:center}
}

/* الطباعة مقفولة طول ما الملف المحمي مفتوح */
@media print{
  body.vw-open > *{display:none !important}
  body.vw-open:before{
    content:"الملف ده للعرض داخل البورتال فقط";display:block;
    padding:60px 20px;text-align:center;font:700 20px var(--fh);color:#103F39;
  }
}
</style>
</head>
<body>

<div id="gate">
  <div class="gate-card">
    <div class="seal">
      <svg viewBox="0 0 24 24"><rect x="4.5" y="10.5" width="15" height="10" rx="2.2"/><path d="M8 10.5V7.4a4 4 0 0 1 8 0v3.1"/></svg>
    </div>
    <h1>بوابة المقررات</h1>
    <p>اكتب كلمة الدخول الخاصة بمقررك</p>
    <div class="pw-wrap">
      <input id="pw" type="password" autocomplete="off" spellcheck="false" placeholder="••••••••••">
      <button id="enter">دخول</button>
      <div id="err"></div>
    </div>
  </div>
  <div class="gate-foot">HASSAN MOHAMED HOSNY</div>
</div>

<div id="app" hidden>
  <header>
    <div class="wrap">
      <div class="brand"><h1 id="cTitle"></h1><span class="rule"></span></div>
      <div class="sub" id="cSub"></div>
    </div>
  </header>

  <div class="weeks-band">
    <div class="wrap">
      <div class="weeks-label">أسابيع الفصل</div>
      <div class="weeks" id="weeks"></div>
    </div>
  </div>

  <main><div class="wrap" id="panel"></div></main>

  <footer>HASSAN MOHAMED HOSNY</footer>
</div>

<!-- العارض المحمي: الملف بيتفك تشفيره في الذاكرة ويترسم صور، من غير أي لينك تحميل -->
<div id="pv" hidden role="dialog" aria-modal="true" aria-labelledby="pvT">
  <div class="pv-bar">
    <button class="pv-x" id="pvX" type="button" aria-label="إغلاق">✕</button>
    <div class="pv-t"><b id="pvT"></b><span id="pvS"></span></div>
    <div class="pv-ctl">
      <button id="pvOut" type="button" aria-label="تصغير">−</button>
      <button id="pvZ" class="pv-z" type="button" title="الحجم الطبيعي">١٠٠٪</button>
      <button id="pvIn" type="button" aria-label="تكبير">+</button>
    </div>
    <span class="pv-pg" id="pvPg"></span>
  </div>
  <div class="pv-main">
    <div class="pv-body" id="pvB"><div class="pv-pages" id="pvP"></div></div>
    <div class="pv-st" id="pvSt" hidden></div>
    <div class="pv-note" id="pvN">الملف ده للعرض بس — التحميل والطباعة والنسخ مقفولين</div>
  </div>
</div>

<script src="data/course-1.js"></script>
<script src="data/course-2.js"></script>
<script>
(function(){
  "use strict";

  /* ---------- أدوات ---------- */
  var AR_D = ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'];
  var AR_M = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
  function ar(n){ return String(n).replace(/[0-9]/g,function(d){return AR_D[+d];}); }
  function fmtDate(iso){
    if(!iso) return '';
    var p = String(iso).split('-');
    if(p.length!==3) return iso;
    var y=+p[0], m=+p[1], d=+p[2];
    if(!m||m<1||m>12) return iso;
    return ar(d)+' '+AR_M[m-1]+' '+ar(y);
  }
  function fmtShort(iso){
    if(!iso) return '';
    var p = String(iso).split('-');
    if(p.length!==3) return iso;
    var m=+p[1], d=+p[2];
    if(!m||m<1||m>12) return iso;
    return ar(d)+' '+AR_M[m-1];
  }
  function esc(s){
    return String(s==null?'':s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }
  function safeUrl(u){
    u = String(u||'').trim();
    return /^https?:\/\//i.test(u) ? u : '';
  }
  function b64d(s){
    var bin = atob(s), out = new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++) out[i]=bin.charCodeAt(i);
    return out;
  }

  /* ---------- فك التشفير ---------- */
  var ITER = 150000;
  function deriveKey(pass, salt){
    var enc = new TextEncoder();
    return crypto.subtle.importKey('raw', enc.encode(pass), 'PBKDF2', false, ['deriveKey'])
      .then(function(km){
        return crypto.subtle.deriveKey(
          {name:'PBKDF2', salt:salt, iterations:ITER, hash:'SHA-256'},
          km, {name:'AES-GCM', length:256}, false, ['decrypt']
        );
      });
  }
  function tryOpen(blob, pass){
    return deriveKey(pass, b64d(blob.salt)).then(function(key){
      return crypto.subtle.decrypt({name:'AES-GCM', iv:b64d(blob.iv)}, key, b64d(blob.ct));
    }).then(function(buf){
      return JSON.parse(new TextDecoder().decode(buf));
    });
  }

  /* ---------- الحالة ---------- */
  var DATA = null, cur = 1;

  /* ---------- البوابة ---------- */
  var gate=document.getElementById('gate'), app=document.getElementById('app'),
      pw=document.getElementById('pw'), btn=document.getElementById('enter'),
      err=document.getElementById('err');

  function fail(msg){
    err.textContent = msg; err.classList.add('on');
    btn.disabled=false; btn.textContent='دخول';
    pw.value=''; pw.focus();
  }

  function unlock(){
    var pass = pw.value;
    if(!pass){ fail('اكتب كلمة الدخول'); return; }
    err.classList.remove('on');
    btn.disabled=true; btn.textContent='جارٍ الفتح…';

    var blobs = window.__PORTAL_BLOBS || {};
    var keys = Object.keys(blobs);
    if(!keys.length){ fail('المحتوى لسه ما اترفعش'); return; }

    var i = 0;
    (function next(){
      if(i >= keys.length){ fail('كلمة الدخول غير صحيحة'); return; }
      tryOpen(blobs[keys[i]], pass).then(function(data){
        DATA = data; render();
      }).catch(function(){ i++; next(); });
    })();
  }

  btn.addEventListener('click', unlock);
  pw.addEventListener('keydown', function(e){ if(e.key==='Enter') unlock(); });

  document.addEventListener('keydown', function(e){
    if(e.ctrlKey && e.shiftKey && (e.key==='L'||e.key==='l')){
      e.preventDefault(); location.reload();
    }
  });

  /* ---------- العرض ---------- */
  function render(){
    var meta = DATA.meta||{};
    document.title = meta.title || 'بوابة المقررات';
    document.getElementById('cTitle').textContent = meta.title||'';
    document.getElementById('cSub').textContent = meta.subtitle||'';

    gate.hidden = true; gate.style.display='none';
    app.hidden = false;

    buildWeeks();
    cur = pickWeek();
    show(cur);
  }

  function weeks(){ return DATA.weeks||[]; }

  function pickWeek(){
    var ws = weeks(), today = new Date().toISOString().slice(0,10), best = 0;
    for(var i=0;i<ws.length;i++){
      if(ws[i].published && ws[i].date && ws[i].date <= today) best = i;
    }
    if(best) return ws[best].n;
    for(var j=0;j<ws.length;j++) if(ws[j].published) return ws[j].n;
    return ws.length ? ws[0].n : 1;
  }

  function buildWeeks(){
    var box = document.getElementById('weeks');
    box.innerHTML='';
    weeks().forEach(function(w){
      var b = document.createElement('button');
      b.className = 'wk' + (w.published?'':' locked');
      b.textContent = ar(w.n);
      b.title = w.date ? fmtDate(w.date) : ('الأسبوع '+ar(w.n));
      b.dataset.n = w.n;
      b.addEventListener('click', function(){ show(w.n); });
      box.appendChild(b);
    });
  }

  function markActive(n){
    var all = document.querySelectorAll('.wk');
    for(var i=0;i<all.length;i++){
      all[i].classList.toggle('active', +all[i].dataset.n === n);
    }
  }

  function show(n){
    cur = n; markActive(n);
    PV_ITEMS = [];
    var w = null, ws = weeks();
    for(var i=0;i<ws.length;i++) if(ws[i].n===n) w=ws[i];
    var panel = document.getElementById('panel');
    if(!w){ panel.innerHTML=''; return; }

    var head =
      '<div class="wk-head">'+
        '<div class="wk-tag"><span>الأسبوع '+ar(w.n)+'</span>'+
          (w.date?'<span class="dot"></span><span class="date">'+esc(fmtDate(w.date))+'</span>':'')+
        '</div>'+
        (w.published
          ? '<h2>'+esc(w.title||'الأسبوع '+ar(w.n))+'</h2>'+
            (w.desc?'<div class="desc">'+esc(w.desc)+'</div>':'')
          : '')+
      '</div>';

    if(!w.published){
      panel.innerHTML = head +
        '<div class="locked-box"><div class="ic">🔒</div>'+
        '<h3>الأسبوع ده لسه ما اتفتحش</h3>'+
        '<p>هيتفتح في وقته بإذن الله</p></div>';
      return;
    }

    var secs = [
      sec(1,'السكشن',   secCount(w.section), bodySection(w.section)),
      sec(2,'مسائل وتدريبات', cnt(w.problems), bodyList(w.problems)),
      sec(3,'اختبار قصير', qCount(w.quiz), bodyQuiz(w.quiz)),
      sec(4,'مصطلحات',  cnt(w.terms), bodyTerms(w.terms)),
      sec(5,'تكليف',    assignChip(w.assign), bodyAssign(w.assign))
    ].join('');

    panel.innerHTML = head + secs;
    wire();
    var first = panel.querySelector('.sec');
    if(first) first.classList.add('open');
  }

  function cnt(a){ a=a||[]; return a.length ? ar(a.length) : '—'; }
  function qCount(a){
    var n = (a||[]).length;
    if(!n) return '—';
    if(n === 1) return 'سؤال واحد';
    if(n === 2) return 'سؤالين';
    return ar(n) + (n <= 10 ? ' أسئلة' : ' سؤال');
  }
  function secCount(a){
    a = a||[];
    var done = 0;
    for(var i=0;i<a.length;i++) if(hasFile(a[i]) || safeUrl(a[i].url)) done++;
    return a.length ? ar(done)+' من '+ar(a.length) : '—';
  }
  function assignChip(as){
    as = as||{};
    if(as.due) return 'التسليم '+fmtShort(as.due);
    var has = (as.text&&as.text.trim()) || (as.items&&as.items.length);
    return has ? 'مطلوب' : '—';
  }

  function sec(n,title,chip,body){
    return '<section class="sec"><button class="sec-head">'+
      '<span class="badge">'+ar(n)+'</span>'+
      '<span class="sec-title">'+title+'</span>'+
      '<span class="chip">'+chip+'</span>'+
      '<span class="spacer"></span>'+
      '<span class="caret">▼</span>'+
      '</button><div class="sec-body">'+body+'</div></section>';
  }

  function bodySection(items){
    items = items||[];
    if(!items.length) return '<div class="empty">لسه ما اترفعش</div>';
    return items.map(function(it){ return rowHtml(it); }).join('');
  }
  function bodyList(items){
    items = items||[];
    if(!items.length) return '<div class="empty">لسه ما اترفعش</div>';
    return items.map(function(it){ return rowHtml(it); }).join('');
  }
  var LOCK_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="9.5" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';
  function rowHtml(it){
    var label = esc(it.label||'بند');
    if(hasFile(it)){
      var idx = PV_ITEMS.push(it) - 1, sz = sizeTxt(it.file.s);
      return '<button type="button" class="row pv" data-pv="'+idx+'">'+
             '<span class="label">'+label+'</span><span class="spacer"></span>'+
             '<span class="tag">'+LOCK_SVG+esc(it.kind||'PDF')+(sz?' · '+sz:'')+'</span>'+
             '<span class="arrow">←</span></button>';
    }
    var u = safeUrl(it.url);
    if(!u){
      return '<div class="row off"><span class="label">'+label+'</span>'+
             '<span class="spacer"></span><span class="tag">لسه</span></div>';
    }
    return '<a class="row" href="'+esc(u)+'" target="_blank" rel="noopener">'+
           '<span class="label">'+label+'</span><span class="spacer"></span>'+
           '<span class="tag">'+esc(it.kind||'PDF')+'</span><span class="arrow">←</span></a>';
  }

  function bodyQuiz(qs){
    qs = qs||[];
    if(!qs.length) return '<div class="empty">لسه ما اترفعش</div>';
    return qs.map(function(q,i){
      var opts = (q.choices||[]).map(function(c,j){
        return '<button class="opt" data-q="'+i+'" data-c="'+j+'">'+esc(c)+'</button>';
      }).join('');
      return '<div class="q" data-ans="'+(q.answer==null?-1:q.answer)+'">'+
        '<div class="qt"><span class="qn">'+ar(i+1)+'.</span><span>'+esc(q.q||'')+'</span></div>'+
        opts +
        (q.why?'<div class="why">'+esc(q.why)+'</div>':'')+
      '</div>';
    }).join('');
  }

  function bodyTerms(ts){
    ts = ts||[];
    if(!ts.length) return '<div class="empty">لسه ما اترفعش</div>';
    return ts.map(function(t){
      return '<div class="term"><span class="t">'+esc(t.term||'')+'</span>'+
        (t.en?'<span class="en">'+esc(t.en)+'</span>':'')+
        (t.def?'<div class="d">'+esc(t.def)+'</div>':'')+
      '</div>';
    }).join('');
  }

  function bodyAssign(as){
    as = as||{};
    var items = as.items||[];
    var text = (as.text||'').trim();
    if(!as.due && !text && !items.length) return '<div class="empty">مفيش تكليف الأسبوع ده</div>';
    var h = '';
    if(as.due){
      h += '<div class="due"><span class="lb">موعد التسليم</span>'+
           '<span class="dt">'+esc(fmtDate(as.due))+'</span></div>';
    }
    if(text) h += '<div class="task">'+esc(text)+'</div>';
    h += items.map(function(it){ return rowHtml(it); }).join('');
    return h;
  }

  function wire(){
    var heads = document.querySelectorAll('.sec-head');
    for(var i=0;i<heads.length;i++){
      heads[i].addEventListener('click', function(){
        this.parentNode.classList.toggle('open');
      });
    }
    var opts = document.querySelectorAll('.opt');
    for(var k=0;k<opts.length;k++){
      opts[k].addEventListener('click', function(){
        var box = this.closest('.q');
        if(box.dataset.done) return;
        box.dataset.done = '1';
        var ans = +box.dataset.ans;
        var all = box.querySelectorAll('.opt');
        for(var m=0;m<all.length;m++){
          all[m].disabled = true;
          if(m === ans) all[m].classList.add('right');
        }
        if(+this.dataset.c !== ans) this.classList.add('wrong');
        var why = box.querySelector('.why');
        if(why) why.classList.add('on');
      });
    }
    var pvr = document.querySelectorAll('.row.pv');
    for(var r=0;r<pvr.length;r++){
      pvr[r].addEventListener('click', function(){
        var it = PV_ITEMS[+this.getAttribute('data-pv')];
        if(it) pvOpen(it, cur, this);
      });
    }
  }

  /* =====================================================================
     العارض المحمي
     الملف متخزن على GitHub مشفّر (.bin). بيتنزل، يتفك تشفيره في الذاكرة
     بمفتاح المقرر، وكل صفحة بتترسم صورة عليها علامة مائية.
     مفيش لينك للـ PDF، ولا زرار تحميل، والطباعة والنسخ والكليك يمين مقفولين.
     ===================================================================== */
  var PDFJS_V = '5.7.284';
  var CDNS = ['https://cdn.jsdelivr.net/npm/pdfjs-dist@'+PDFJS_V, 'https://unpkg.com/pdfjs-dist@'+PDFJS_V];
  var BIN_RE = /^[A-Za-z0-9._-]+\.bin$/;
  var WM2 = 'HASSAN MOHAMED HOSNY';
  var ZS = [0.5, 0.75, 1, 1.25, 1.5, 2, 2.5, 3];
  var MAX_PX = 12e6;
  var PV_ITEMS = [];
  var libP = null, keyP = null, libTry = 0;
  var pv = {tok:0, open:false, pushed:false, skipPop:false, from:null, task:null, doc:null,
            pages:[], z:1, cur:0, busy:false, io:null, gen:0, raf:0, nt:0, rt:0, wacc:0};

  function $(id){ return document.getElementById(id); }
  function hasFile(it){ return !!(it && it.file && typeof it.file.n==='string' && BIN_RE.test(it.file.n)); }
  function sizeTxt(s){
    s = +s || 0;
    if(!s) return '';
    return s < 1048576 ? Math.max(1, Math.round(s/1024))+' KB' : (s/1048576).toFixed(1).replace(/\.0$/,'')+' MB';
  }

  function loadLib(){
    if(libP) return libP;
    var imp;
    try{ imp = new Function('u', 'return import(u)'); }
    catch(e){ return Promise.reject(e); }
    // المتصفح بيفتكر أي import فشل، فالمحاولة التانية بعنوان مختلف سنة
    var q = libTry++ ? '?t='+libTry : '';
    libP = new Promise(function(ok, bad){
      var i = 0;
      (function next(err){
        if(i >= CDNS.length){ bad(err || new Error('lib')); return; }
        var base = CDNS[i++];
        Promise.resolve().then(function(){ return imp(base+'/legacy/build/pdf.min.mjs'+q); })
          .then(function(lib){
            if(!lib || !lib.getDocument) throw new Error('lib');
            lib.GlobalWorkerOptions.workerSrc = base+'/legacy/build/pdf.worker.min.mjs'+q;
            ok({lib:lib, base:base});
          })
          .catch(next);
      })();
    });
    libP.catch(function(){ libP = null; });
    return libP;
  }

  function fileKey(){
    if(keyP) return keyP;
    if(!DATA || typeof DATA.fk!=='string' || !DATA.fk) return Promise.reject(new Error('nokey'));
    var raw;
    try{ raw = b64d(DATA.fk); }catch(e){ return Promise.reject(new Error('nokey')); }
    keyP = crypto.subtle.importKey('raw', raw, {name:'AES-GCM'}, false, ['decrypt']);
    keyP.catch(function(){ keyP = null; });
    return keyP;
  }

  function fetchBin(url, onp, fresh){
    var opt = {credentials:'omit'};
    if(fresh) opt.cache = 'reload';   // «جرّب تاني» ماياخدش 404 قديم من الكاش
    if(window.AbortController){ pv.ac = new AbortController(); opt.signal = pv.ac.signal; }
    return fetch(url, opt).then(function(r){
      if(!r.ok){ var e = new Error('http'); e.status = r.status; throw e; }
      var total = +(r.headers.get('content-length')||0);
      if(!total || !r.body || !r.body.getReader) return r.arrayBuffer();
      var rd = r.body.getReader(), parts = [], got = 0;
      return (function pump(){
        return rd.read().then(function(x){
          if(x.done){
            var out = new Uint8Array(got), o = 0;
            for(var i=0;i<parts.length;i++){ out.set(parts[i], o); o += parts[i].length; }
            return out.buffer;
          }
          parts.push(x.value); got += x.value.length;
          onp(Math.min(1, got/total));
          return pump();
        });
      })();
    });
  }

  /* شكل الملف: "SPF1" + ١٢ بايت IV + النص المشفّر (AES-256-GCM) */
  function openBin(buf){
    var u = new Uint8Array(buf);
    if(u.length < 33 || u[0]!==83 || u[1]!==80 || u[2]!==70 || u[3]!==49) return Promise.reject(new Error('fmt'));
    return fileKey().then(function(k){
      return crypto.subtle.decrypt({name:'AES-GCM', iv:u.subarray(4,16)}, k, u.subarray(16));
    });
  }

  function pvStatus(kind, msg, retry, bar){
    var st = $('pvSt');
    if(!kind){ st.hidden = true; st.innerHTML = ''; return; }
    st.hidden = false;
    if(kind === 'load'){
      st.innerHTML = '<div class="pv-spin"></div><div class="msg">'+esc(msg)+'</div>'+
        (bar ? '<div class="pv-prog"><i id="pvBar"></i></div>' : '');
    } else {
      st.innerHTML = '<div class="pv-ic">!</div><div class="msg">'+esc(msg)+'</div>'+
        (retry ? '<button class="pv-retry" id="pvR" type="button">جرّب تاني</button>' : '');
      if(retry) $('pvR').onclick = retry;
    }
  }

  function pvOpen(it, wn, from){
    if(!hasFile(it)) return;
    pv.from = from || null;
    $('pvT').textContent = it.label || 'ملف';
    $('pvS').textContent = 'الأسبوع '+ar(wn)+' · للعرض فقط';
    $('pvPg').innerHTML = '';
    var el = $('pv');
    el.hidden = false;
    document.body.classList.add('vw-open');
    requestAnimationFrame(function(){ el.classList.add('on'); });
    pv.open = true;
    if(!pv.pushed){ try{ history.pushState({pv:1}, ''); pv.pushed = true; }catch(e){} }
    try{ $('pvX').focus({preventScroll:true}); }catch(e){}
    pvLoad(it.file);
  }

  function pvLoad(f, again){
    pvReset();
    var tok = ++pv.tok, stage = 'fetch';
    pvStatus('load', 'جارٍ تحميل الملف…', null, true);
    var lib = loadLib();
    lib.catch(function(){});
    var url = 'data/'+f.n+(f.v ? '?v='+encodeURIComponent(f.v) : '');
    fetchBin(url, function(r){
      if(tok !== pv.tok) return;
      var b = $('pvBar'); if(b) b.style.width = Math.round(r*100)+'%';
    }, again)
    .then(function(buf){
      if(tok !== pv.tok) throw 0;
      stage = 'decrypt';
      return openBin(buf);
    })
    .then(function(pdf){
      if(tok !== pv.tok) throw 0;
      stage = 'lib';
      pvStatus('load', 'جارٍ تجهيز الصفحات…');
      return lib.then(function(L){ return {L:L, data:new Uint8Array(pdf)}; });
    })
    .then(function(x){
      if(tok !== pv.tok) throw 0;
      stage = 'parse';
      var b = x.L.base;
      pv.task = x.L.lib.getDocument({
        data:x.data, verbosity:0, enableXfa:false,
        cMapUrl:b+'/cmaps/', cMapPacked:true,
        standardFontDataUrl:b+'/standard_fonts/', wasmUrl:b+'/wasm/', iccUrl:b+'/iccs/'
      });
      return pv.task.promise;
    })
    .then(function(doc){
      if(tok !== pv.tok) throw 0;
      pv.doc = doc;
      return pvPages(doc, tok);
    })
    .then(function(){
      if(tok !== pv.tok) return;
      pvStatus(null);
      pvLayout(); pvObserve(); pvTrack(); pvPump();
    })
    .catch(function(e){
      if(tok !== pv.tok || e === 0) return;
      var retry = function(){ pvLoad(f, true); }, m;
      if(stage === 'fetch'){
        if(e && e.status === 404) m = 'الملف لسه ما اترفعش — جرّب كمان شوية';
        else if(e && e.status) m = 'السيرفر مردّش — جرّب تاني';
        else m = 'مفيش اتصال بالنت — اتأكد وجرّب تاني';
      }
      else if(stage === 'decrypt'){ m = 'الملف ده مش متوافق مع المقرر — بلّغ المعيد'; retry = null; }
      else if(stage === 'lib') m = 'العارض ما اتحمّلش — اتأكد من النت، ولو فضلت المشكلة حدّث المتصفح';
      else if(e && e.name === 'InvalidPDFException'){ m = 'الملف ده مش PDF سليم — بلّغ المعيد'; retry = null; }
      else m = 'تعذّر فتح الملف — جرّب تاني';
      pvStatus('err', m, retry);
    });
  }

  function pvPages(doc, tok){
    var jobs = [];
    for(var i=1;i<=doc.numPages;i++) jobs.push(doc.getPage(i));
    return Promise.all(jobs).then(function(pages){
      if(tok !== pv.tok) throw 0;
      var box = $('pvP');
      box.innerHTML = '';
      pv.pages = pages.map(function(pg, i){
        var vp = pg.getViewport({scale:1});
        var el = document.createElement('div');
        el.className = 'pv-page';
        el.setAttribute('data-i', i);
        el.innerHTML = '<div class="sh"></div>';
        box.appendChild(el);
        return {i:i, pg:pg, w:vp.width, h:vp.height, el:el, cv:null, task:null,
                near:false, stale:true, bad:false, cw:0, ch:0};
      });
    });
  }

  function pvAvail(){
    var b = $('pvB');
    return Math.max(160, Math.min((b.clientWidth || window.innerWidth) - 24, 900));
  }

  /* كل صفحة بتاخد عرض الشاشة (لحد ٩٠٠px) × التكبير */
  function pvLayout(){
    var aw = pvAvail();
    pv.gen++;
    for(var i=0;i<pv.pages.length;i++){
      var p = pv.pages[i], s = aw / p.w * pv.z;
      p.cw = Math.round(p.w*s); p.ch = Math.round(p.h*s);
      p.el.style.width = p.cw+'px'; p.el.style.height = p.ch+'px';
      p.stale = true;
    }
  }

  function pvObserve(){
    if(pv.io){ pv.io.disconnect(); pv.io = null; }
    if(!('IntersectionObserver' in window)){
      for(var k=0;k<pv.pages.length;k++) pv.pages[k].near = true;
      return;
    }
    pv.io = new IntersectionObserver(function(ents){
      for(var i=0;i<ents.length;i++){
        var p = pv.pages[+ents[i].target.getAttribute('data-i')];
        if(!p) continue;
        p.near = ents[i].isIntersecting;
        if(!p.near) pvDrop(p);
      }
      pvPump();
    }, {root:$('pvB'), rootMargin:'100% 0px 100% 0px'});
    for(var j=0;j<pv.pages.length;j++) pv.io.observe(pv.pages[j].el);
  }

  /* الصفحات البعيدة عن الشاشة بتتشال من الذاكرة (مهم للموبايل) */
  function pvDrop(p){
    if(p.task){ try{ p.task.cancel(); }catch(e){} p.task = null; }
    if(p.cv){
      p.cv.width = 0; p.cv.height = 0;
      if(p.cv.parentNode) p.cv.parentNode.removeChild(p.cv);
      p.cv = null;
    }
    p.el.classList.remove('ld');
    p.stale = true;
  }

  function pvPump(){
    if(pv.busy || !pv.doc || !pv.open) return;
    var best = null, bd = 1e9;
    for(var i=0;i<pv.pages.length;i++){
      var p = pv.pages[i];
      if(p.near && !p.bad && (p.stale || !p.cv)){
        var d = Math.abs(i - pv.cur);
        if(d < bd){ bd = d; best = p; }
      }
    }
    if(!best) return;
    pv.busy = true;
    var tok = pv.tok;
    pvRender(best).then(null, function(){}).then(function(){
      if(tok !== pv.tok) return;
      pv.busy = false;
      pvPump();
    });
  }

  function pvRender(p){
    var gen = pv.gen;
    var dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    var s = p.cw / p.w * dpr;
    var area = p.w * p.h * s * s;
    if(area > MAX_PX) s *= Math.sqrt(MAX_PX / area);
    var vp = p.pg.getViewport({scale:s});
    var cv = document.createElement('canvas');
    cv.width = Math.max(1, Math.floor(vp.width));
    cv.height = Math.max(1, Math.floor(vp.height));
    if(!p.cv) p.el.classList.add('ld');
    var t = p.pg.render({canvas:cv, viewport:vp});
    p.task = t;
    return t.promise.then(function(){
      if(p.task === t) p.task = null;
      p.el.classList.remove('ld');
      if(!p.near || !pv.open){ cv.width = 0; cv.height = 0; return; }
      stamp(cv);
      if(p.cv){
        p.cv.width = 0; p.cv.height = 0;
        if(p.cv.parentNode) p.cv.parentNode.removeChild(p.cv);
      }
      p.el.insertBefore(cv, p.el.firstChild);
      p.cv = cv;
      p.stale = (gen !== pv.gen);
    }, function(e){
      if(p.task === t) p.task = null;
      cv.width = 0; cv.height = 0;
      p.el.classList.remove('ld');
      if(!(e && e.name === 'RenderingCancelledException')){ p.bad = true; p.el.classList.add('bad'); }
      throw e;
    });
  }

  /* علامة مائية جوه الصورة نفسها: اسم المقرر + اسمك */
  function stamp(cv){
    var ctx = cv.getContext('2d');
    if(!ctx) return;
    var w = cv.width, h = cv.height;
    var t1 = (DATA && DATA.meta && DATA.meta.title) || '';
    var fs = Math.max(10, Math.round(Math.min(w, h) / 26));
    var gx = fs*14, gy = fs*6, R = Math.sqrt(w*w + h*h)/2 + gx, pts = [];
    for(var y=-R, r=0; y<=R; y+=gy, r++){
      for(var x=-R + (r%2 ? gx/2 : 0); x<=R; x+=gx) pts.push(x, y);
    }
    ctx.save();
    ctx.translate(w/2, h/2);
    ctx.rotate(-Math.PI/7);
    ctx.globalAlpha = 0.085;
    ctx.fillStyle = '#103F39';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    var i;
    try{ ctx.direction = 'rtl'; }catch(e){}
    ctx.font = '700 '+fs+'px Tajawal, "IBM Plex Sans Arabic", Arial, sans-serif';
    for(i=0;i<pts.length;i+=2) ctx.fillText(t1, pts[i], pts[i+1] - fs*0.55);
    try{ ctx.direction = 'ltr'; }catch(e){}
    ctx.font = '600 '+Math.round(fs*0.56)+'px "IBM Plex Sans Arabic", Arial, sans-serif';
    for(i=0;i<pts.length;i+=2) ctx.fillText(WM2, pts[i], pts[i+1] + fs*0.6);
    ctx.restore();
  }

  function pvTrack(){
    var b = $('pvB'), n = pv.pages.length;
    if(!n){ $('pvPg').innerHTML = ''; return; }
    var y = b.scrollTop + b.clientHeight*0.35, c = 0;
    for(var i=0;i<n;i++){ if(pv.pages[i].el.offsetTop <= y) c = i; else break; }
    pv.cur = c;
    $('pvPg').innerHTML = '<span class="pw">صفحة </span>'+ar(c+1)+' من '+ar(n);
  }

  function zoomUi(){
    $('pvZ').textContent = ar(Math.round(pv.z*100))+'٪';
    $('pvOut').disabled = pv.z <= ZS[0];
    $('pvIn').disabled = pv.z >= ZS[ZS.length-1];
  }

  /* بيحافظ على مكانك في الصفحة بعد التكبير/التصغير */
  function pvAnchor(fn){
    var b = $('pvB'), p = pv.pages[pv.cur];
    var off = p ? (b.scrollTop - p.el.offsetTop) / Math.max(1, p.el.offsetHeight) : 0;
    fn();
    if(p) b.scrollTop = p.el.offsetTop + off*p.el.offsetHeight;
    var extra = b.scrollWidth - b.clientWidth;
    if(extra > 0){
      var rtl = (window.getComputedStyle ? getComputedStyle(b).direction : 'rtl') === 'rtl';
      b.scrollLeft = (rtl ? -1 : 1) * extra/2;
    }
  }

  function pvZoom(d){
    if(!pv.doc || !pv.pages.length) return;
    var i = ZS.indexOf(pv.z); if(i < 0) i = 2;
    var nz = d === 0 ? 1 : ZS[Math.max(0, Math.min(ZS.length-1, i+d))];
    if(nz === pv.z) return;
    pvAnchor(function(){ pv.z = nz; pvLayout(); });
    zoomUi(); pvTrack(); pvPump();
  }

  function pvReset(){
    if(pv.ac){ try{ pv.ac.abort(); }catch(e){} pv.ac = null; }
    if(pv.io){ pv.io.disconnect(); pv.io = null; }
    for(var i=0;i<pv.pages.length;i++){
      var p = pv.pages[i];
      if(p.task){ try{ p.task.cancel(); }catch(e){} }
      if(p.cv){ p.cv.width = 0; p.cv.height = 0; }
    }
    pv.pages = [];
    var t = pv.task, d = pv.doc;
    pv.task = null; pv.doc = null;
    if(t){ try{ t.destroy(); }catch(e){} }
    else if(d){ try{ d.destroy(); }catch(e){} }
    pv.busy = false; pv.cur = 0; pv.z = 1; pv.wacc = 0;
    $('pvP').innerHTML = '';
    $('pvB').scrollTop = 0;
    $('pvPg').innerHTML = '';
    pvStatus(null);
    zoomUi();
  }

  function pvClose(fromPop){
    if(!pv.open) return;
    pv.open = false;
    pv.tok++;
    pvReset();
    var el = $('pv');
    el.classList.remove('on'); el.hidden = true;
    document.body.classList.remove('vw-open');
    $('pvN').classList.remove('on');
    if(pv.pushed){
      pv.pushed = false;
      if(!fromPop){ pv.skipPop = true; try{ history.back(); }catch(e){ pv.skipPop = false; } }
    }
    if(pv.from){ try{ pv.from.focus({preventScroll:true}); }catch(e){} pv.from = null; }
  }

  function pvNote(){
    var n = $('pvN');
    n.classList.add('on');
    clearTimeout(pv.nt);
    pv.nt = setTimeout(function(){ n.classList.remove('on'); }, 2200);
  }

  $('pvX').addEventListener('click', function(){ pvClose(false); });
  $('pvIn').addEventListener('click', function(){ pvZoom(1); });
  $('pvOut').addEventListener('click', function(){ pvZoom(-1); });
  $('pvZ').addEventListener('click', function(){ pvZoom(0); });

  $('pvB').addEventListener('scroll', function(){
    if(pv.raf) return;
    pv.raf = requestAnimationFrame(function(){ pv.raf = 0; pvTrack(); });
  }, {passive:true});

  /* Ctrl + عجلة الماوس (أو قرصة التاتش باد) = تكبير العارض نفسه */
  $('pvB').addEventListener('wheel', function(e){
    if(!e.ctrlKey) return;
    e.preventDefault();
    pv.wacc += e.deltaY;
    if(Math.abs(pv.wacc) > 80){ pvZoom(pv.wacc < 0 ? 1 : -1); pv.wacc = 0; }
  }, {passive:false});

  window.addEventListener('resize', function(){
    if(!pv.open) return;
    clearTimeout(pv.rt);
    pv.rt = setTimeout(function(){
      if(pv.open && pv.pages.length){ pvAnchor(pvLayout); pvTrack(); pvPump(); }
    }, 160);
  });

  /* زرار الرجوع في الموبايل بيقفل الملف بدل ما يخرج من البورتال */
  window.addEventListener('popstate', function(){
    if(pv.skipPop){ pv.skipPop = false; return; }
    if(pv.open){ pv.pushed = false; pvClose(true); }
  });

  (function(){
    var el = $('pv');
    ['contextmenu','dragstart','selectstart','copy','cut'].forEach(function(t){
      el.addEventListener(t, function(e){
        e.preventDefault();
        if(t === 'contextmenu' || t === 'copy' || t === 'cut') pvNote();
      });
    });
  })();

  document.addEventListener('keydown', function(e){
    if(!pv.open) return;
    var c = e.code || '', k = String(e.key || '').toLowerCase(), mod = e.ctrlKey || e.metaKey;
    if(k === 'escape' || c === 'Escape'){ e.preventDefault(); pvClose(false); return; }
    if(mod && (/^Key[SPCAX]$/.test(c) || (k.length === 1 && 'spcax'.indexOf(k) >= 0))){
      e.preventDefault(); e.stopPropagation(); pvNote(); return;
    }
    if(mod && (c === 'Equal' || c === 'NumpadAdd' || k === '+' || k === '=')){ e.preventDefault(); pvZoom(1); return; }
    if(mod && (c === 'Minus' || c === 'NumpadSubtract' || k === '-')){ e.preventDefault(); pvZoom(-1); return; }
    if(mod && (c === 'Digit0' || c === 'Numpad0' || k === '0')){ e.preventDefault(); pvZoom(0); }
  }, true);

  pw.focus();
})();
</script>
</body>
</html>
